<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<meta name="description" content="84-day back-safe gym plan tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Back-Safe">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Back-Safe Gym Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-thumb phone column (max 560px). Sticky top bar, scrolling day view, fixed action bar + 4-tab nav in the thumb zone, bottom sheets for check-ins. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#E8EDF2; --ink:#0A2540; --text:#333333; --muted:#566576; --line:rgba(10,37,64,.12);
  --brand:#0A2540; --brand-2:#1A3A5C; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.74); --brand-track:rgba(255,255,255,.16);
  --accent:#F9C642; --on-accent:#0A2540;
  --ok:#1F8A5B; --ok-bg:#DDF1E7; --safe:#2A72B8; --safe-bg:#DDEAF7; --warn:#8A5D00; --warn-bg:#FCEFCB; --bad:#C2413B; --bad-bg:#F8E0DE;
  --shadow:0 6px 22px rgba(10,37,64,.08); --scrim:rgba(10,37,64,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --nav-h:64px; --bar-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061A2E; --surface:#0C2A47; --surface-2:#173C60; --ink:#FFFFFF; --text:#D9E2EB; --muted:#A0B3C6; --line:rgba(255,255,255,.11);
  --brand:#123A60; --brand-2:#1A3A5C; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.74); --brand-track:rgba(255,255,255,.16);
  --accent:#F9C642; --on-accent:#0A2540;
  --ok:#45C08A; --ok-bg:rgba(69,192,138,.16); --safe:#6AAEF0; --safe-bg:rgba(106,174,240,.16); --warn:#F9C642; --warn-bg:rgba(249,198,66,.14); --bad:#F2776F; --bad-bg:rgba(242,119,111,.16);
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061A2E; --surface:#0C2A47; --surface-2:#173C60; --ink:#FFFFFF; --text:#D9E2EB; --muted:#A0B3C6; --line:rgba(255,255,255,.11);
  --brand:#123A60; --brand-2:#1A3A5C; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.74); --brand-track:rgba(255,255,255,.16);
  --accent:#F9C642; --on-accent:#0A2540;
  --ok:#45C08A; --ok-bg:rgba(69,192,138,.16); --safe:#6AAEF0; --safe-bg:rgba(106,174,240,.16); --warn:#F9C642; --warn-bg:rgba(249,198,66,.14); --bad:#F2776F; --bad-bg:rgba(242,119,111,.16);
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;min-height:52px}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark .logo{width:30px;height:30px;border-radius:9px;background:var(--brand-2);display:grid;place-items:center;flex:none}
.brandmark b{font-family:var(--f-display);font-size:21px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--accent)}
.sync[data-s="offline"] i{background:var(--bad)}

main{padding-block:14px calc(var(--nav-h) + var(--bar-h) + 28px + env(safe-area-inset-bottom,0px))}
main > .wrap{display:flex;flex-direction:column;gap:14px}
.view-enter{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);border:1px solid var(--line)}
.card-pad{padding:16px}
.card h2{font-size:17px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}

/* hero */
.hero{background:var(--brand);color:var(--on-brand);border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:18px solid var(--brand-track);pointer-events:none}
.hero .eyebrow{color:var(--on-brand-muted)}
.hero h1{color:var(--on-brand);font-family:var(--f-display);font-size:36px;line-height:1;letter-spacing:.005em}
.hero .rx{color:var(--on-brand-muted);font-size:14px}
.code{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:22px;font-weight:700;flex:none}
.code.rest{background:var(--brand-track);color:var(--on-brand)}
.hero .meter{display:flex;align-items:center;gap:12px}
.hero .track{flex:1;height:8px;border-radius:99px;background:var(--brand-track);overflow:hidden}
.hero .track b{display:block;height:100%;background:var(--accent);border-radius:99px}
.chip-on-brand{display:inline-flex;align-items:center;gap:6px;background:var(--brand-track);color:var(--on-brand);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.hero-stats{display:flex;gap:18px;position:relative;z-index:1}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--f-display);font-size:26px;line-height:1.05}
.hero-stats span{font-size:12px;color:var(--on-brand-muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.4}
.pill svg{width:13px;height:13px}
.p-done{background:var(--ok-bg);color:var(--ok)}
.p-mod{background:var(--safe-bg);color:var(--safe)}
.p-skip,.p-unlogged{background:var(--bad-bg);color:var(--bad)}
.p-pending{background:var(--accent);color:var(--on-accent)}
.p-future,.p-rest{background:var(--surface-2);color:var(--muted)}
.hero .pill{background:var(--accent);color:var(--on-accent)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);border:1px solid var(--line)}
.banner .ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.banner .ic svg{width:16px;height:16px}
.banner b{color:var(--ink);display:block}
.banner p{margin:2px 0 0;font-size:14px}
.b-ok{background:var(--ok-bg)} .b-ok .ic{background:var(--ok);color:var(--surface)}
.b-warn{background:var(--warn-bg)} .b-warn .ic{background:var(--warn);color:var(--surface)}
.b-bad{background:var(--bad-bg)} .b-bad .ic{background:var(--bad);color:var(--surface)}
.b-info{background:var(--surface)} .b-info .ic{background:var(--accent);color:var(--on-accent)}
.banner .btn{margin-top:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-dark{background:var(--brand-2);color:var(--on-brand)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-line{border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn-danger{background:var(--bad);color:#FFFFFF}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.linkbtn{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}

/* sections (details) */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow)}
details.sec > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;cursor:pointer}
details.sec > summary::-webkit-details-marker{display:none}
.sec-title{flex:1;min-width:0}
.sec-title b{display:block;color:var(--ink);font-size:16px}
.sec-title span{font-size:13px;color:var(--muted)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s;flex:none}
details[open] > summary .chev{transform:rotate(180deg)}
.sec-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.check{width:44px;height:44px;margin:-6px;display:grid;place-items:center;flex:none;border-radius:50%}
.check i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.check svg{width:16px;height:16px;opacity:0}
.check[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check[aria-pressed="true"] svg{opacity:1}
.check:active i{transform:scale(.9)}

/* drills */
.drill{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.drill:first-child{border-top:0;padding-top:2px}
.drill .n{font-family:var(--f-display);font-size:18px;color:var(--muted);grid-row:span 2}
.drill b{color:var(--ink);font-weight:600}
.drill .r{font-weight:600;color:var(--ink);font-size:14px}
.drill p{margin:0;font-size:14px;color:var(--muted);grid-column:2}
.drill.skip b,.drill.skip .r{color:var(--muted);text-decoration:line-through}

/* exercise card */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ex.complete{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-bg),var(--ok-bg)),var(--surface)}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-head .t{flex:1;min-width:0}
.ex-head b{color:var(--ink);font-size:16px;display:block;line-height:1.3}
.ex-head .m{font-size:13px;color:var(--muted)}
.rxv{text-align:right;flex:none}
.rxv b{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink);white-space:nowrap}
.rxv span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ss{background:var(--accent);color:var(--on-accent)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-weight:700;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums;transition:all .12s}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set:active{transform:scale(.92)}
.logrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:44px;height:44px;font-size:20px;font-weight:600;color:var(--ink)}
.stepper input{width:64px;height:44px;border:0;background:transparent;text-align:center;font-weight:700;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stepper .u{font-size:13px;color:var(--muted);padding-right:10px}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--bg);min-height:44px;flex:1;min-width:110px}
.field label{font-size:13px;color:var(--muted);white-space:nowrap}
.field input{border:0;background:transparent;width:100%;min-width:0;font-size:16px;color:var(--ink);font-weight:600;height:42px}
[tabindex="-1"]:focus{outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75;font-weight:500}
.how{font-size:14px;color:var(--text)}
.how summary{color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:" ›";}
.how[open] summary::after{content:" ‹"}
.how p{margin:4px 0 0}
.lastline{font-size:12px;color:var(--muted)}
.pair{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pair-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.holdbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px}
.holdbtn svg{width:14px;height:14px}

/* key-value rows */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink);font-weight:500}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-height:60px}
.habit:first-of-type{border-top:0}
.habit .t{flex:1;min-width:0}
.habit .t b{color:var(--ink);display:block;font-weight:600}
.habit .t span{font-size:13px;color:var(--muted)}
.habit .streak{font-size:12px;font-weight:700;color:var(--ink);background:var(--surface-2);padding:3px 8px;border-radius:99px;white-space:nowrap}

/* action bar + nav */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none}
.actionbar .wrap{padding-block:10px;display:flex;gap:10px;pointer-events:auto}
.actionbar .wrap::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:-1}
.actionbar .btn{flex:1;min-height:52px;font-size:16px;box-shadow:var(--shadow)}
.actionbar .btn.grow{flex:2}
.actionbar .logged{flex:2;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:52px;box-shadow:var(--shadow)}
.actionbar .logged b{color:var(--ink)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(249,198,66,.6)}50%{box-shadow:0 0 0 8px rgba(249,198,66,0)}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;min-height:44px;text-decoration:none}
a.btn{text-decoration:none}
.tab .ib{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] .ib{background:var(--accent);color:var(--on-accent)}
.tab[aria-current="page"] svg .fillable{fill:currentColor}

/* timer pill */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--bar-h) + 10px + env(safe-area-inset-bottom,0px));z-index:27;background:var(--brand-2);color:var(--on-brand);border-radius:99px;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.timer .tl{font-size:13px;color:var(--on-brand-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tv{font-family:var(--f-display);font-size:26px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.timer button{min-width:44px;height:40px;border-radius:99px;color:var(--on-brand);font-weight:700;font-size:14px;padding:0 8px}
.timer button:active{background:var(--brand-track)}
.timer.done{background:var(--accent);color:var(--on-accent)}
.timer.done .tl,.timer.done button{color:var(--on-accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .wrap{display:flex;flex-direction:column;gap:16px;padding-block:8px 4px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.sheet h2{font-size:22px;font-family:var(--f-display);letter-spacing:.01em}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;padding:10px 8px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:13px;font-weight:600;color:var(--ink)}
.opt svg{width:20px;height:20px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt.o-done[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.o-mod[aria-pressed="true"]{border-color:var(--safe);background:var(--safe-bg);color:var(--safe)}
.opt.o-skip[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{height:44px;border-radius:10px;background:var(--surface-2);font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"].z-ok{background:var(--ok);color:var(--surface)}
.scale button[aria-pressed="true"].z-warn{background:var(--warn);color:var(--surface)}
.scale button[aria-pressed="true"].z-bad{background:var(--bad);color:var(--surface)}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{height:44px;border-radius:12px;border:2px solid var(--line);font-weight:600;color:var(--ink)}

.dayrow .s span{font-size:13px;color:var(--muted)}

.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:600;color:var(--ink);align-self:flex-start}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

:root[data-theme="light"] .bp .bar b{background:var(--brand-2)}
.bp .meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}

.z-ok-f{fill:var(--ok-bg)} .z-warn-f{fill:var(--warn-bg)} .z-bad-f{fill:var(--bad-bg)}
.gridline{stroke:var(--line);stroke-width:1}

   if(d.off&&!d.s){out[k]={t:base,home:false,off:d.off,base:base};prev=null;continue;}

function statusOf(k){

 var d=day(k),t=today();
 if(d.s){if((d.s==='done'||d.s==='home')&&d.missed&&d.missed.length)return 'part';return d.s;}
 if(d.off&&baseType(k)!=='R')return k<t?'skip':'offplan';
 if(baseType(k)==='R'&&!d.mk){var h=d.h||{};if(h.am||h.pm||h.walk)return 'done';return k<t?'rest':(k===t?'pending':'future');}

}

function stats(){
 var c={done:0,part:0,home:0,mod:0,skip:0,unlogged:0,rest:0,left:0},st=[];
 for(var i=0;i<PROGRAM_DAYS;i++){var s=statusOf(keyAt(i));st.push(s);if(c[s]!==undefined)c[s]++;else c.left++;}
 var ti=Math.min(idxOf(today()),PROGRAM_DAYS-1),cur=0,j=ti;
 if(j>=0&&st[j]==='pending')j--;
 for(;j>=0;j--){var x=st[j];if(isDone(x))cur++;else if(x==='rest')continue;else break;}
 var best=0,run=0;for(var q=0;q<=ti;q++){var y=st[q];if(isDone(y)){run++;if(run>best)best=run;}else if(y==='rest'||y==='pending'){}else run=0;}
 c.st=st;c.cur=cur;c.best=best;c.all=c.done+c.part+c.home+c.mod;c.pct=Math.round(c.all/PROGRAM_DAYS*100);c.missed=c.skip+c.unlogged;return c;

function weekReview(i){
 var t=today(),sessions=0,done=0,pains=[],leg=false;
 for(var j=0;j<7;j++){var k=keyAt(i*7+j);if(k>t)continue;var d=day(k);if(baseType(k)!=='R'){sessions++;if(isDone(statusOf(k)))done++;}else if(d.mk&&isDone(d.s))done++;if(typeof d.pain==='number')pains.push(d.pain);if(d.leg)leg=true;}
 var max=pains.length?Math.max.apply(null,pains):null,sl=slots()[i],rec='advance',why='Pain stayed at 3/10 or less and you trained consistently. Move on.';
 if(leg||(max!==null&&max>5)){rec='back';why='Pain went above 5/10 or into your leg. Go back one week; stick to stretches and walking until it settles.';}

 else if(max>=4){rec='repeat';why="Pain reached "+max+"/10. Repeat the week and don't add weight.";}

function weekSummary(si){
 var days=[],gym={A:0,B:0,C:0},homeT={A:0,B:0,C:0},moved=[];
 for(var j=0;j<7;j++){var k=keyAt(si*7+j),dt=dayType(k),s=statusOf(k);days.push({k:k,dt:dt,s:s});
  if(dt.t==='R'||dt.off)continue;if(s==='skip'||s==='unlogged')continue;

function weekCardio(si){var plan=0,done=0;for(var j=0;j<7;j++){var k=keyAt(si*7+j),d=day(k),s=statusOf(k);
  if(baseType(k)==='R'){if((d.h||{}).walk)done+=30;if(d.mk&&isDone(s)&&(d.missed||[]).indexOf('cardio')<0)done+=45;continue;}
  if(d.off&&!d.s)continue;plan+=45;
  if((isDone(s)&&s!=='mod'&&(d.missed||[]).indexOf('cardio')<0)||(!d.s&&(d.sec||{}).cardio)||s==='mod')done+=45;}
 return {plan:plan,done:done,short:Math.max(0,plan-done)};}

function painWeek(si){var a=[];if(si<0)return null;for(var j=0;j<7;j++){var p=day(keyAt(si*7+j)).pain;if(typeof p==='number')a.push(p);}return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}

  if(on&&i<n-1){var ex=EX.filter(function(x){return x.id===b.dataset.ex;})[0];startTimer(a==='set'?90:(+b.dataset.r||45),'Rest'+(ex?' · '+ex.name:''));}
  else if(on&&a==='set')startTimer(90,'Rest · next exercise');
  break;}
 case 'step': {var inp=document.getElementById('w-'+k+'-'+b.dataset.ex);var base=num(inp.value||inp.placeholder)||0;var nv=Math.max(0,Math.round((base+parseFloat(b.dataset.d))*100)/100);
  editDay(k,function(d){d.ex=d.ex||{};d.ex[b.dataset.ex]=d.ex[b.dataset.ex]||{};d.ex[b.dataset.ex].w=String(nv);},true);inp.value=nv;break;}
 case 'usew': editDay(k,function(d){d.ex=d.ex||{};d.ex[b.dataset.ex]=d.ex[b.dataset.ex]||{};d.ex[b.dataset.ex].w=b.dataset.v;},true);render(false);toast('Set to '+b.dataset.v+' kg. Keep the form clean.');break;
 case 'top': editDay(k,function(d){var l=d.ex[b.dataset.ex];l.top=!l.top;},true);render(false);if(day(k).ex[b.dataset.ex].top)toast('Noted. Next time the app suggests one step heavier.');break;
 case 'sec': editDay(k,function(d){d.sec=d.sec||{};d.sec[b.dataset.sec]=!d.sec[b.dataset.sec];},true);render(false);break;
 case 'habit': {var on2=b.getAttribute('aria-pressed')!=='true';editDay(k,function(d){d.h=d.h||{};d.h[b.dataset.h]=on2;});render(false);break;}
 case 'food': {var on3=b.getAttribute('aria-pressed')!=='true';editDay(k,function(d){d.food=d.food||{};d.food[b.dataset.f]=on3;});render(false);if(on3&&b.dataset.f==='shake'&&habitStreak('shake')>1)toast(habitStreak('shake')+'-day shake streak');break;}
 case 'hold': startTimer(+b.dataset.s,b.dataset.l);break;
 case 't-add': Tm.end=Math.max(Tm.end,Date.now())+15000;if(!Tm.iv){Tm.iv=setInterval(tickTimer,250);$('#timer').classList.remove('done');}tickTimer();break;
 case 't-x': clearInterval(Tm.iv);Tm.iv=null;$('#timer').hidden=true;break;
 case 'bc-p': {var pv=+b.dataset.v;editDay(today(),function(d){d.pain=pv;if(d.leg===undefined)d.leg=false;});ui.bcEdit=false;render(false);
  if(pv>=4&&(day(today()).lvl||S.meta.lvl)==='hard')toast('Pain '+pv+'/10: using Medium today');else if(pv>5)toast('Back-safe day: stretches + walking only');break;}
 case 'bc-l': editDay(today(),function(d){d.leg=b.dataset.v==='1';});if(typeof day(today()).pain==='number')ui.bcEdit=false;render(false);break;
 case 'bc-edit': ui.bcEdit=true;render(false);break;
 case 'lvl': {var lv=b.dataset.v;editDay(k,function(d){d.lvl=lv;});editMeta(function(m){m.lvl=lv;});render(false);toast(LEVELS[lv].n+' level');break;}
 case 'ps': {var pon=b.dataset.v==='1';editDay(k,function(d){if(pon)d.ps=true;else delete d.ps;});
  if(b.dataset.sheet!==undefined){_sched=null;plannerSheet(+b.dataset.sheet);}else{render(false);}
  var dt=dayType(k);toast(pon?'Home day: bodyweight '+SESS[dt.t].short.toLowerCase()+' + 45-min walk':'Back to a gym day');break;}
 case 'planner': plannerSheet(+b.dataset.i);break;
 case 'checkin': {var d0=day(k),lp=latestPain(k),pp=planFor(k);ui.ci={k:k,parts:defaultParts(k,pp),why:d0.why||null,s:b.dataset.s||d0.s||'done',pain:typeof d0.pain==='number'?d0.pain:(lp?lp.p:null),leg:typeof d0.pain==='number'?!!d0.leg:(lp?lp.leg:false),note:d0.note||''};ciSheet();break;}
 case 'ci-part': ui.ci.note=($('#ci-note')||{}).value||ui.ci.note;ui.ci.parts[b.dataset.v]=!ui.ci.parts[b.dataset.v];ciSheet();break;
 case 'ci-why': ui.ci.note=($('#ci-note')||{}).value||ui.ci.note;ui.ci.why=b.dataset.v;ciSheet();break;
 case 'pmode': {var md=b.dataset.v;editDay(k,function(d){delete d.ps;delete d.off;if(md==='home')d.ps=true;if(md==='off')d.off='other';});
  if(b.dataset.sheet!==undefined){_sched=null;plannerSheet(+b.dataset.sheet);}else if(!$('#sheet').hidden){closeSheet();}else render(false);
  var dtm=dayType(k);toast(md==='home'?'Home day: bodyweight '+SESS[dtm.t].short.toLowerCase()+' + 45-min walk':(md==='off'?'Day off. The week re-balances.':'Back to a gym day'));break;}
 case 'preason': if(b.dataset.sheet!==undefined){editDay(k,function(d){d.off=b.dataset.v;delete d.ps;});_sched=null;plannerSheet(+b.dataset.sheet);}else{ui.offPick=b.dataset.v;document.querySelectorAll('.reasons [data-act=preason]').forEach(function(x){x.setAttribute('aria-pressed',x===b);});}break;
 case 'offsheet': offSheet(k);break;
 case 'offsave': editDay(k,function(d){d.off=ui.offPick||d.off||'other';delete d.ps;});ui.offPick=null;closeSheet();toast('Day off · '+OFF[day(k).off]+'. The week re-balances.');break;
 case 'ci-s': ui.ci.note=($('#ci-note')||{}).value||ui.ci.note;ui.ci.s=b.dataset.v;ciSheet();break;
 case 'ci-p': ui.ci.note=($('#ci-note')||{}).value||ui.ci.note;ui.ci.pain=+b.dataset.v;ciSheet();break;
 case 'ci-l': ui.ci.note=($('#ci-note')||{}).value||ui.ci.note;ui.ci.leg=b.dataset.v==='1';ciSheet();break;
 case 'ci-save': {var c=ui.ci;c.note=($('#ci-note')||{}).value||'';var kk=c.k;
  var pr=planFor(kk),pf=partsFor(c.s==='home').map(function(x){return x[0];}),missed=pf.filter(function(x){return !c.parts[x];});
  if((c.s==='done'||c.s==='home')&&missed.length===pf.length)c.s='skip';
  editDay(kk,function(d){d.s=c.s;if(typeof c.pain==='number')d.pain=c.pain;else delete d.pain;d.leg=!!c.leg;if(c.note)d.note=c.note.slice(0,1000);else delete d.note;if(c.s==='home'&&!d.mk)d.ps=true;
   delete d.off;if(c.s==='skip'&&c.why)d.why=c.why;else delete d.why;
   if((c.s==='done'||c.s==='home')&&pr.type!=='R'){d.sec=d.sec||{};pf.forEach(function(x){d.sec[x]=!!c.parts[x];});if(missed.length)d.missed=missed;else delete d.missed;}else delete d.missed;},c.s!=='skip');
  closeSheet();var st=stats();toast(c.s==='skip'?'Logged as skipped. The week re-balances.':missed.length&&c.s!=='mod'?'Saved as partly done · '+plural(missed.length,'part')+' missed':(st.cur>1?'Saved · '+st.cur+'-day streak':'Saved · day '+(idxOf(kk)+1)+' of 84'));break;}
 case 'sheetclose': closeSheet();break;
 case 'openday': if(idxOf(k)>=PROGRAM_DAYS)break;if(k===today()){if(location.hash==='#today'){ui.dayKey=null;render(true);}else location.hash='#today';}else{ui.tab='plan';ui.dayKey=k;ui.slot=Math.max(0,Math.floor(idxOf(k)/7));if(location.hash!=='#plan')history.replaceState(null,'','#plan');render(true);window.scrollTo(0,0);}break;
 case 'back': ui.dayKey=null;render(true);window.scrollTo(0,0);break;
 case 'slot': ui.slot=+b.dataset.i;render(false);break;
 case 'review': ui.tab='plan';ui.dayKey=null;ui.slot=+b.dataset.i;history.replaceState(null,'','#plan');render(true);setTimeout(function(){var c2=document.querySelector('.decide');if(c2)c2.scrollIntoView({block:'center'});},60);break;
 case 'toweigh': setTimeout(function(){var w2=document.getElementById('weighin');if(w2)w2.scrollIntoView({block:'start'});},80);break;
 case 'decide': {var ii=+b.dataset.i,dv=b.dataset.d;editMeta(function(m){m.decisions=m.decisions||{};m.decisions[ii]=dv;});render(false);var nsl=slots()[ii+1];toast('Week '+(ii+2)+' is now plan week '+nsl.w+' · '+WEEKS[nsl.w].phase);break;}
 case 'makeup': editDay(k,function(d){d.mk=b.dataset.m;});render(false);toast('Make-up session added for today');break;
 case 'unmakeup': editDay(k,function(d){delete d.mk;delete d.ex;delete d.sec;delete d.core;delete d.hx;delete d.t;});render(false);break;
 case 'pt': ui.pt=k;render(false);break;
 case 'weigh': {var kg=num($('#m-kg').value),wa=num($('#m-waist').value);if(kg===null&&wa===null){toast('Enter your weight or waist first');break;}
  var t=today();editMeta(function(m){m.body=(m.body||[]).filter(function(x){return x.k!==t;});var e2={k:t};if(kg!==null)e2.kg=kg;if(wa!==null)e2.waist=wa;m.body.push(e2);});render(false);toast('Weigh-in saved');break;}
 case 'cleartg': editMeta(function(m){m.tg={};});render(false);toast('Using the plan’s numbers again');break;
 case 'backup': {var txt=JSON.stringify(S);var done=function(){toast('Backup copied. Paste it into Notes to keep it.');};
  try{navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);});}catch(err){fallbackCopy(txt);}break;}
 case 'restoreopen': ui.restoreOpen=!ui.restoreOpen;render(false);break;
 case 'restore': {try{var o=JSON.parse($('#restoreText').value);if(!o||!o.meta||!o.days)throw 0;var now=Date.now();o.meta.u=now;o.meta.tg=o.meta.tg||{};Object.keys(o.days).forEach(function(x){o.days[x].u=now;});S=o;saveLocal();Object.keys(S.days).forEach(function(x){Sync.dirty['d-'+x]=1;});Sync.dirty.meta=1;scheduleFlush();ui.restoreOpen=false;render(false);toast('Backup restored');}catch(err){toast('That isn’t a valid backup. Paste the whole text you copied.');}break;}
 case 'reset': ui.confirmReset=true;render(false);break;
 case 'resetno': ui.confirmReset=false;render(false);break;
 case 'resetyes': {var ids=Object.keys(S.days);var now2=Date.now();ids.forEach(function(x){S.days[x]={u:now2};Sync.dirty['d-'+x]=1;});S.meta={start:S.meta.start,decisions:{},body:[],tg:{},lvl:'med',u:now2};Sync.dirty.meta=1;_sched=null;saveLocal();scheduleFlush();ui.confirmReset=false;render(false);toast('All data erased');break;}
 }
});
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'Backup copied. Paste it into Notes to keep it.':'Copy didn’t work here. Try again from your phone’s browser.');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();}});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',function(){if(!document.hidden)softRender();});
var lastDay=today();setInterval(function(){if(today()!==lastDay){lastDay=today();softRender();}},60000);

// test hook: BackSafe.setToday('2026-12-02')
window.BackSafe={setToday:function(k){todayOverride=k||null;lastDay=today();render(false);},state:function(){return S;},save:function(){_sched=null;saveLocal();render(false);}};

route();
initSync();
})();
